name: Deploy Publisher (Azure Web App)

on:
  push:
    branches: [main]
    paths:
      - 'src/Publisher/**'
      - 'src/Shared/**'
      - '.github/workflows/deploy-publisher.yml'
  workflow_dispatch:

# Required for OIDC federated authentication to Azure (no stored secrets).
permissions:
  id-token: write
  contents: read

env:
  DOTNET_VERSION: '10.0.x'
  PROJECT: src/Publisher/Publisher.csproj
  PUBLISH_DIR: ${{ github.workspace }}/publish-publisher
  RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'ferron-psa-rg' }}
  # Override in repo settings → Variables if your App Service has a different name.
  APP_NAME: ${{ vars.PUBLISHER_APP_NAME || 'otel-distributed-trace-demo-publisher' }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish
        run: dotnet publish "${{ env.PROJECT }}" -c Release -o "${{ env.PUBLISH_DIR }}"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Inject the Datadog OTLP API key (never leaves GitHub secrets). The trace
      # endpoint/protocol are already configured on the app; this sets the
      # dd-api-key header plus the OTLP logs intake settings.
      - name: Configure Datadog OTLP API key
        uses: azure/cli@v2
        with:
          inlineScript: |
            az webapp config appsettings set \
              -g "${{ env.RESOURCE_GROUP }}" -n "${{ env.APP_NAME }}" \
              --settings "OTEL_EXPORTER_OTLP_HEADERS=dd-api-key=${{ secrets.DD_API_KEY }}" \
                         "OTEL_EXPORTER_OTLP_TRACES_HEADERS=dd-api-key=${{ secrets.DD_API_KEY }},compute_stats=true" \
                         "OTEL_EXPORTER_OTLP_LOGS_HEADERS=dd-api-key=${{ secrets.DD_API_KEY }}" \
                         "OTEL_EXPORTER_OTLP_LOGS_ENDPOINT=https://otlp.datadoghq.com/v1/logs" \
                         "OTEL_EXPORTER_OTLP_LOGS_PROTOCOL=http/protobuf" \
              -o none

      # Tag telemetry with the source revision for Datadog Source Code Integration.
      # The SHA is the commit this run built, so it changes on every deploy.
      - name: Configure Datadog Git metadata
        uses: azure/cli@v2
        with:
          inlineScript: |
            az webapp config appsettings set \
              -g "${{ env.RESOURCE_GROUP }}" -n "${{ env.APP_NAME }}" \
              --settings "DD_GIT_COMMIT_SHA=${{ github.sha }}" \
                         "DD_GIT_REPOSITORY_URL=${{ github.server_url }}/${{ github.repository }}" \
              -o none

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP_NAME }}
          package: ${{ env.PUBLISH_DIR }}
