name: Deploy Publisher (Azure Web App)

on:
  push:
    branches: [main]
    paths:
      - 'src/Publisher/**'
      - '.github/workflows/deploy-publisher.yml'
  workflow_dispatch:

# Required for OIDC federated authentication to Azure (no stored secrets).
permissions:
  id-token: write
  contents: read

env:
  DOTNET_VERSION: '10.0.x'
  PROJECT: src/Publisher/Publisher.csproj
  PUBLISH_DIR: ${{ github.workspace }}/publish-publisher
  # Override in repo settings → Variables if your App Service has a different name.
  APP_NAME: ${{ vars.PUBLISHER_APP_NAME || 'otel-distributed-trace-demo-publisher' }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish
        run: dotnet publish "${{ env.PROJECT }}" -c Release -o "${{ env.PUBLISH_DIR }}"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP_NAME }}
          package: ${{ env.PUBLISH_DIR }}
